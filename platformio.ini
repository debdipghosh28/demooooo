; =====================================================================================
; Relivio MedPredict - PlatformIO Multi-Board Configuration
; Supports: ESP32 Dev Module & Arduino Uno (ATmega328P)
; =====================================================================================

[platformio]
default_envs = esp32dev, uno
description = Relivio Clinical Telemetry Node for ESP32 & Arduino Uno

; -------------------------------------------------------------------------------------
; 1. ESP32 Environment (ESP32 Dev Module / NodeMCU-32S / ESP-WROOM-32)
; -------------------------------------------------------------------------------------
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial Monitor & Upload Speeds
monitor_speed = 115200
upload_speed = 921600

; Preprocessor Definitions
build_flags = 
    -D BOARD_ESP32=1
    -D CORE_DEBUG_LEVEL=0
    -D MONITOR_BAUD=115200

; -------------------------------------------------------------------------------------
; 2. Arduino Uno Environment (ATmega328P)
; -------------------------------------------------------------------------------------
[env:uno]
platform = atmelavr
board = uno
framework = arduino

; Serial Monitor & Upload Speeds
monitor_speed = 115200
upload_speed = 115200

; Preprocessor Definitions
build_flags = 
    -D BOARD_UNO=1
    -D MONITOR_BAUD=115200
